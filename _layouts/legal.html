<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<link rel="icon" href="{{ '/logo.svg' | relative_url }}" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0E100F; color: #F5F6F4; font: 16px/1.7 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  a { color: #DDA76A; }
  .back { display: inline-block; margin-bottom: 24px; color: #B4BFB6; text-decoration: none; font-size: 14px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 36px 0 8px; }
  p, li { color: #D9DED9; }
  em { color: #768278; font-style: normal; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 16px 0; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #262B27; vertical-align: top; }
  th { color: #B4BFB6; font-weight: 600; }
  code { background: #171A18; padding: 2px 6px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="{{ '/' | relative_url }}">← Selfward</a>
  {{ content }}
</main>
</body>
</html>
